<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Verify Email and Phone</title>
  <desc id="desc">Clean placeholder image for email and phone verification codes.</desc>
  <rect width="1200" height="720" fill="#f7f7f3"/>
  <rect x="170" y="90" width="860" height="540" rx="28" fill="#ffffff" stroke="#deded6" stroke-width="3"/>
  <text x="600" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="54" font-weight="700" fill="#222222">Verification Codes</text>
  <text x="600" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#707070">Enter the codes sent to your email and phone</text>
  <g fill="#fbfbf8" stroke="#e8e8e2">
    <rect x="290" y="308" width="620" height="70" rx="10"/>
    <rect x="290" y="418" width="620" height="70" rx="10"/>
  </g>
  <text x="320" y="352" font-family="Arial, sans-serif" font-size="24" fill="#707070">Email code</text>
  <text x="320" y="462" font-family="Arial, sans-serif" font-size="24" fill="#707070">SMS code</text>
</svg>
